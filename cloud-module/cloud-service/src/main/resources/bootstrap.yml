#Seata分布式事务配置(AT模式)
seata:
  port: 7091
  enabled: true
  application-id: ${spring.application.name}
  #客户端和服务端在同一个事务组
#  tx-service-group: cloud-service
  enable-auto-data-source-proxy: true
#  service:
#    vgroup-mapping:
#      cloud-service: default
  config:
    type: nacos
    nacos:
      namespace: b6237e20-d183-4d75-b038-66eeaaf1390d
      serverAddr: 127.0.0.1:8848
      group: seata-group
      username: nacos
      password: nacos
  #服务注册到nacos
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 127.0.0.1:8848
      group: seata-group
      namespace: b6237e20-d183-4d75-b038-66eeaaf1390d
      username: nacos
      password: nacos
      cluster: default

