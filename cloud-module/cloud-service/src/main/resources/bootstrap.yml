server:
  port: 9022
  servlet:
    context-path: /service
spring:
  application:
    name: cloud-service
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: root
        loginPassword: root
      seata: true
    url: jdbc:mysql://localhost:3306/spring_runner
    username: root
    password: root
  cloud:
    nacos:
      discovery:
        # 注册中心地址
        server-addr: 127.0.0.1:8848
        namespace: public
        username: nacos
        password: nacos
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        namespace: public
        username: nacos
        password: nacos
        file-extension: yml
        name: cloud-service  #相当于data-id
    openfeign:
      httpclient:
        connection-timeout: 200
        max-connections: 10
    # 配置流量卫兵
    sentinel:
      transport:
        dashboard: localhost:9000
          # 关闭Context收敛，这样被监控方法可以进行不同链路的单独控制
      web-context-unify: false
      block-page: /block
  # 消息队列：
  rabbitmq:
    username: user
    password: user
    virtual-host: /cloud-service
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
          max-interval: 2000ms
    addresses: 127.0.0.1:5672
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      table-prefix: tb_
logging:
  level:
    com.alibaba.cloud.sentinel.SentinelProperties: trace
feign:
  sentinel:
    enabled: true

